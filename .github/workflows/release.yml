name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    # Merge with "[skip release]" in the commit message to hold off the
    # automatic patch bump, e.g. before a manual minor/major bump. A manual
    # run (workflow_dispatch) always goes ahead, skip marker or not.
    if: "github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run semantic-release version --skip-build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: .
