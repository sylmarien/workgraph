start = "implement"

[defaults]
harness = "claude"
model = "fable"
effort = "high"

[nodes.implement]
agent = "implement"
outcomes = ["done"]

[nodes.implement.limits]
visits = 5

[nodes.implement.transitions]
done = "test"

[nodes.test]
command = "sh -c 'uv run ruff check && uv run ruff format --check && uv run mypy && uv run pytest'"

[nodes.test.transitions]
pass = "review"
fail = "implement"

[nodes.review]
map = ["code-review", "overengineering-review"]
resolve = "all"

[nodes.review.limits]
visits = 3

[nodes.review.transitions]
pass = "pr"
fail = "implement"
LIMIT = "summary"

[nodes.code-review]
agent = "code-review"
outcomes = ["pass", "fail"]

[nodes.overengineering-review]
agent = "overengineering-review"
outcomes = ["pass", "fail"]

[nodes.summary]
agent = "summarize-review"
model = "sonnet"
effort = "medium"
outcomes = ["done"]

[nodes.summary.transitions]
done = "pr"

[nodes.pr]
agent = "pr"
model = "haiku"
effort = "medium"
outcomes = ["done"]

[nodes.pr.transitions]
done = "END"
