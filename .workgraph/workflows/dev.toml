start = "plan"

[defaults]
harness = "claude"
model = "claude-fable-5-1"
effort = "high"

[nodes.plan]
agent = "plan"
effort = "xhigh"
outcomes = ["done"]

[nodes.plan.transitions]
done = "approve-plan"

[nodes.approve-plan]
gate = "Implement this plan?"

[nodes.approve-plan.transitions]
accept = "implement"
reject = "plan"

[nodes.implement]
agent = "implement"
model = "claude-opus-5"
outcomes = ["done"]

[nodes.implement.transitions]
done = "test"

[nodes.test]
command = "sh -c 'uv run ruff check && uv run ruff format --check && uv run mypy && uv run pytest'"

[nodes.test.limits]
visits = 5
reset = "pass"

[nodes.test.transitions]
pass = "review"
fail = "implement"

[nodes.review]
map = ["code-review", "overengineering-review"]
resolve = "all"

[nodes.review.transitions]
pass = "pr"
fail = "review-loop"

# Holds the review limit so the LIMIT diversion carries the review findings.
[nodes.review-loop]
command = "true"

[nodes.review-loop.limits]
visits = 2

[nodes.review-loop.transitions]
pass = "implement"
fail = "implement"
LIMIT = "summary"

[nodes.code-review]
agent = "code-review"
outcomes = ["pass", "fail"]

[nodes.overengineering-review]
agent = "overengineering-review"
outcomes = ["pass", "fail"]

[nodes.summary]
agent = "summarize-review"
model = "sonnet"
effort = "medium"
outcomes = ["done"]

[nodes.summary.transitions]
done = "pr"

[nodes.pr]
agent = "pr"
model = "haiku"
effort = "medium"
outcomes = ["done"]

[nodes.pr.transitions]
done = "END"
