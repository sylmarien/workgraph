[project]
name = "workgraph"
version = "0.2.5"
description = "Graph workflow orchestrator."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "termaid[rich]>=0.8.0",
    "tomlkit>=0.15.1",
]

[project.scripts]
workgraph = "workgraph.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "python-semantic-release>=10.6.2",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=workgraph --cov-report=term-missing"

[tool.coverage.report]
fail_under = 100

[tool.semantic_release]
commit_parser = "release_parser:AlwaysPatchCommitParser"
version_toml = ["pyproject.toml:project.version"]
version_variables = [".claude-plugin/plugin.json:version", ".codex-plugin/plugin.json:version"]
allow_zero_version = true
